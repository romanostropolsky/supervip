<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Диспетчерська система</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }

    /* Login Modal */
    #login-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .login-card { background: white; padding: 30px; border-radius: 12px; width: 320px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .login-card h2 { margin-bottom: 20px; text-align: center; }

    /* Layout */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .nav { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
    .nav-btn { padding: 10px 20px; border: none; background: none; font-weight: bold; cursor: pointer; border-radius: 6px; }
    .nav-btn.active { background: var(--primary); color: white; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Forms & Inputs */
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 0.9em; }
    input, select, button { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; }
    button { background: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { opacity: 0.9; }
    button.btn-danger { background: var(--danger); }

    /* Cards & Tables */
    .card { background: var(--surface); padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: #f1f5f9; }

    /* Stop row inside Order Form */
    .stop-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .stop-row select, .stop-row input { flex: 1; }

    .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; }
    .badge-new { background: #dbeafe; color: #1e40af; }
  </style>
</head>
<body>

  <!-- ВХІД У СИСТЕМУ -->
  <div id="login-overlay">
    <div class="login-card">
      <h2>Авторизація</h2>
      <div class="form-group">
        <label>Логін</label>
        <input type="text" id="login-user" value="admin">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="login-pass" value="admin123">
      </div>
      <button onclick="login()">Увійти</button>
      <p id="login-error" style="color:red; margin-top:10px; font-size:0.8em;"></p>
    </div>
  </div>

  <div class="container" id="app" style="display:none;">
    <div class="header">
      <h1>🚖 Диспетчерська система</h1>
      <button style="width:auto; background:#64748b;" onclick="logout()">Вийти</button>
    </div>

    <!-- НАВІГАЦІЯ -->
    <div class="nav">
      <button class="nav-btn active" onclick="switchTab('orders-tab')">📦 Замовлення</button>
      <button class="nav-btn" onclick="switchTab('drivers-tab')">👨‍✈️ Водії</button>
      <button class="nav-btn" onclick="switchTab('cities-tab')">🏙 Міста</button>
    </div>

    <!-- ВКЛАДКА ЗАМОВЛЕНЬ -->
    <div id="orders-tab" class="tab-content active">
      <div class="card">
        <h3>Нове замовлення</h3>
        <form id="order-form" onsubmit="createOrder(event)">
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="form-group">
              <label>Клієнт (Ім'я / Телефон)</label>
              <input type="text" id="ord-client" required placeholder="Іван +380...">
            </div>
            <div class="form-group">
              <label>Кількість пасажирів</label>
              <input type="number" id="ord-passengers" min="1" value="1" required>
            </div>
          </div>

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="form-group">
              <label>Час виїзду</label>
              <input type="datetime-local" id="ord-time">
            </div>
            <div class="form-group">
              <label>Ціна (грн)</label>
              <input type="number" id="ord-price" placeholder="500">
            </div>
          </div>

          <label>Маршрут (Звідки - Куди)</label>
          <div id="stops-container">
            <div class="stop-row">
              <select class="city-select" required></select>
              <input type="time" class="time-select">
            </div>
            <div class="stop-row">
              <select class="city-select" required></select>
              <input type="time" class="time-select">
            </div>
          </div>
          <button type="button" style="background:#64748b; margin-bottom:15px; width:auto; padding:5px 10px;" onclick="addStopRow()">+ Додати зупинку</button>

          <button type="submit">Створити замовлення</button>
        </form>
      </div>

      <div class="card">
        <h3>Список замовлень</h3>
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Клієнт</th>
              <th>Пасажири</th>
              <th>Маршрут</th>
              <th>Виїзд</th>
              <th>Ціна</th>
              <th>Дії</th>
            </tr>
          </thead>
          <tbody id="orders-list"></tbody>
        </table>
      </div>
    </div>

    <!-- ВКЛАДКА ВОДІЇВ -->
    <div id="drivers-tab" class="tab-content">
      <div class="card">
        <h3>Додати водія</h3>
        <form onsubmit="createDriver(event)">
          <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
            <input type="text" id="drv-name" placeholder="ПІБ Водія" required>
            <input type="text" id="drv-phone" placeholder="Телефон" required>
            <input type="text" id="drv-car" placeholder="Авто (марка/модель)" required>
          </div>
          <button type="submit" style="margin-top:10px;">Зберегти водія</button>
        </form>
      </div>

      <div class="card">
        <h3>Водії</h3>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>ПІБ</th>
              <th>Телефон</th>
              <th>Авто</th>
              <th>Дії</th>
            </tr>
          </thead>
          <tbody id="drivers-list"></tbody>
        </table>
      </div>
    </div>

    <!-- ВКЛАДКА МІСТ -->
    <div id="cities-tab" class="tab-content">
      <div class="card">
        <h3>Додати місто</h3>
        <form onsubmit="createCity(event)" style="display:flex; gap:10px;">
          <input type="text" id="city-name" placeholder="Назва міста" required>
          <button type="submit" style="width: auto;">Додати</button>
        </form>
      </div>

      <div class="card">
        <h3>Доступні міста</h3>
        <ul id="cities-list" style="list-style:none; padding:0;"></ul>
      </div>
    </div>

  </div>

  <script>
    let citiesCache = [];

    async function login() {
      const u = document.getElementById('login-user').value;
      const p = document.getElementById('login-pass').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();
      if (data.ok || data.success) {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        initData();
      } else {
        document.getElementById('login-error').innerText = data.message || 'Помилка входу';
      }
    }

    function logout() {
      location.reload();
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    async function initData() {
      await loadCities();
      await loadOrders();
      await loadDrivers();
    }

    async function loadCities() {
      const res = await fetch('/api/cities');
      citiesCache = await res.json();
      
      const list = document.getElementById('cities-list');
      list.innerHTML = citiesCache.map(c => `
        <li style="padding: 8px 0; border-bottom: 1px solid #eee; display:flex; justify-content:space-between;">
          ${c.name}
          <button class="btn-danger" style="width:auto; padding: 2px 8px;" onclick="deleteCity(${c.id})">🗑</button>
        </li>
      `).join('');

      updateCitySelects();
    }

    function updateCitySelects() {
      const selects = document.querySelectorAll('.city-select');
      selects.forEach(sel => {
        const currentVal = sel.value;
        sel.innerHTML = '<option value="">Оберіть місто</option>' + 
          citiesCache.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        sel.value = currentVal;
      });
    }

    function addStopRow() {
      const container = document.getElementById('stops-container');
      const div = document.createElement('div');
      div.className = 'stop-row';
      div.innerHTML = `
        <select class="city-select" required></select>
        <input type="time" class="time-select">
      `;
      container.appendChild(div);
      updateCitySelects();
    }

    async function createCity(e) {
      e.preventDefault();
      const name = document.getElementById('city-name').value;
      await fetch('/api/cities', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      document.getElementById('city-name').value = '';
      loadCities();
    }

    async function deleteCity(id) {
      await fetch(`/api/cities/${id}`, { method: 'DELETE' });
      loadCities();
    }

    async function loadOrders() {
      const res = await fetch('/api/orders');
      const orders = await res.json();
      const tbody = document.getElementById('orders-list');
      
      tbody.innerHTML = orders.map(o => {
        let stopsText = '';
        try {
          const parsed = typeof o.stops === 'string' ? JSON.parse(o.stops) : o.stops;
          if (Array.isArray(parsed)) {
            stopsText = parsed.map(s => `${s.city} ${s.time ? '('+s.time+')' : ''}`).join(' ➔ ');
          }
        } catch(e) {}

        return `
          <tr>
            <td>#${o.id}</td>
            <td>${o.client || '-'}</td>
            <td>${o.passengers || 1}</td>
            <td>${stopsText || '-'}</td>
            <td>${o.departure_time ? new Date(o.departure_time).toLocaleString('uk-UA') : '-'}</td>
            <td>${o.price ? o.price + ' грн' : '-'}</td>
            <td>
              <button class="btn-danger" style="width:auto; padding:4px 8px;" onclick="deleteOrder(${o.id})">Видалити</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function createOrder(e) {
      e.preventDefault();
      
      const client = document.getElementById('ord-client').value;
      const passengers = document.getElementById('ord-passengers').value;
      const departure_time = document.getElementById('ord-time').value;
      const price = document.getElementById('ord-price').value;

      const stops = [];
      document.querySelectorAll('.stop-row').forEach(row => {
        const city = row.querySelector('.city-select').value;
        const time = row.querySelector('.time-select').value;
        if (city) stops.push({ city, time });
      });

      const res = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ client, passengers, departure_time, price, stops })
      });

      if (res.ok) {
        document.getElementById('order-form').reset();
        loadOrders();
      } else {
        alert('Помилка при створенні замовлення!');
      }
    }

    async function deleteOrder(id) {
      if (confirm('Видалити замовлення?')) {
        await fetch(`/api/orders/${id}`, { method: 'DELETE' });
        loadOrders();
      }
    }

    async function loadDrivers() {
      const res = await fetch('/api/drivers');
      const drivers = await res.json();
      const tbody = document.getElementById('drivers-list');
      
      tbody.innerHTML = drivers.map(d => `
        <tr>
          <td>${d.id}</td>
          <td>${d.name}</td>
          <td>${d.phone || '-'}</td>
          <td>${d.car_model || '-'}</td>
          <td>
            <button class="btn-danger" style="width:auto; padding:4px 8px;" onclick="deleteDriver(${d.id})">Видалити</button>
          </td>
        </tr>
      `).join('');
    }

    async function createDriver(e) {
      e.preventDefault();
      const name = document.getElementById('drv-name').value;
      const phone = document.getElementById('drv-phone').value;
      const car_model = document.getElementById('drv-car').value;

      await fetch('/api/drivers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone, car_model })
      });

      document.getElementById('drv-name').value = '';
      document.getElementById('drv-phone').value = '';
      document.getElementById('drv-car').value = '';
      loadDrivers();
    }

    async function deleteDriver(id) {
      if (confirm('Видалити водія?')) {
        await fetch(`/api/drivers/${id}`, { method: 'DELETE' });
        loadDrivers();
      }
    }
  </script>
</body>
</html>
