<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Диспетчерська</title>
  <style>
    :root {
      --bg: #12141c;
      --panel: #1a1d26;
      --panel-2: #222632;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #2e3545;
      --ok: #10b981;
      --bad: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; width: 100vw; height: 100vh; overflow: hidden; }
    aside { width: 240px; min-width: 240px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; z-index: 10; }
    .logo { padding: 20px; font-weight: bold; font-size: 16px; color: var(--accent); letter-spacing: 1px; border-bottom: 1px solid var(--border); }
    .menu { padding: 10px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; flex: 1; }
    .menu-item { padding: 10px 14px; border-radius: 6px; cursor: pointer; color: var(--muted); font-size: 14px; transition: 0.2s; user-select: none; }
    .menu-item:hover, .menu-item.active { background: var(--panel-2); color: var(--text); }
    main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; position: relative; }
    header { height: 60px; min-height: 60px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: flex-end; padding: 0 20px; gap: 20px; background: var(--panel); width: 100%; }
    .top-stat { font-size: 13px; color: var(--muted); }
    .top-stat span { color: var(--accent); font-weight: bold; }
    .content { padding: 20px; width: 100%; max-width: 1000px; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .page-title { font-size: 20px; margin-bottom: 20px; font-weight: 600; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; }
    input, select { width: 100%; padding: 10px; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; font-size: 14px; outline: none; }
    button { background: var(--accent); color: #000; border: none; padding: 12px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; width: 100%; margin-top: 10px; }
    button:hover { background: var(--accent-hover); }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; }
    .badge.new { background: #3b82f6; color: #fff; }
    .badge.sent { background: #f59e0b; color: #000; }
    .badge.completed { background: #10b981; color: #fff; }
    .badge.cancelled { background: #ef4444; color: #fff; }
    .row-flex { display: flex; gap: 10px; }
  </style>
</head>
<body>
  <aside>
    <div class="logo">ДИСПЕТЧЕРСЬКА</div>
    <div class="menu" id="menu">
      <div class="menu-item active" data-page="new-order">Нове замовлення</div>
      <div class="menu-item" data-page="orders">Замовлення</div>
      <div class="menu-item" data-page="drivers">Водії</div>
      <div class="menu-item" data-page="routes-tariffs">Маршрути і тарифи</div>
      <div class="menu-item" data-page="register-driver">Реєстрація водія</div>
      <div class="menu-item" data-page="reports">Звіт</div>
      <div class="menu-item" data-page="dispatchers">Диспетчери</div>
    </div>
  </aside>
  <main>
    <header>
      <div class="top-stat">ВОДІЇ ОНЛАЙН <span id="onlineDriversCount">0</span></div>
      <div class="top-stat">АКТИВНИХ ЗАМОВЛЕНЬ <span id="activeOrdersCount">0</span></div>
    </header>
    <div class="content" id="mainContent"></div>
  </main>

  <script>
    async function api(url, method = 'GET', data = null) {
      try {
        const opts = { method, headers: { 'Content-Type': 'application/json' } };
        if (data) opts.body = JSON.stringify(data);
        const res = await fetch('/api' + url, opts);
        return await res.json();
      } catch (e) {
        return {};
      }
    }

    async function loadStats() {
      const drivers = await api('/drivers');
      if (Array.isArray(drivers)) {
        document.getElementById('onlineDriversCount').innerText = drivers.filter(d => d.status === 'online').length;
      }
      const orders = await api('/orders');
      if (Array.isArray(orders)) {
        document.getElementById('activeOrdersCount').innerText = orders.filter(o => o.status === 'new' || o.status === 'sent').length;
      }
    }

    function getCities() {
      const saved = localStorage.getItem('custom_cities');
      if (saved) return JSON.parse(saved);
      return ['Київ', 'Умань', 'Одеса', 'Львів', 'Кишинів'];
    }

    function saveCities(cities) {
      localStorage.setItem('custom_cities', JSON.stringify(cities));
    }

    function getTariffs() {
      const saved = localStorage.getItem('custom_tariffs');
      if (saved) return JSON.parse(saved);
      return [
        { id: 1, from: 'Київ', to: 'Умань', price: 1500 },
        { id: 2, from: 'Київ', to: 'Одеса', price: 3500 },
        { id: 3, from: 'Київ', to: 'Львів', price: 4000 }
      ];
    }

    function saveTariffs(tariffs) {
      localStorage.setItem('custom_tariffs', JSON.stringify(tariffs));
    }

    const pages = {
      'new-order': async (el) => {
        const cityNames = getCities();
        const tariffs = getTariffs();
        const [config, drivers] = await Promise.all([api('/config'), api('/drivers')]);
        
        el.innerHTML = `
          <h2 class="page-title">Нове замовлення</h2>
          <div class="panel">
            <form id="orderForm">
              <div class="row-flex">
                <div class="form-group" style="flex:1;">
                  <label>Звідки</label>
                  <select id="fromCity">
                    ${cityNames.map(c => `<option value="${c}">${c}</option>`).join('')}
                  </select>
                </div>
                <div class="form-group" style="flex:1;">
                  <label>Куди</label>
                  <select id="toCity">
                    ${cityNames.map(c => `<option value="${c}" ${c === 'Умань' ? 'selected' : ''}>${c}</option>`).join('')}
                  </select>
                </div>
              </div>
              <div class="form-group">
                <label>Розрахована ціна (грн)</label>
                <input type="text" id="routePrice" readonly style="font-weight:bold; color:var(--accent);">
              </div>
              <div class="form-group">
                <label>Клас авто</label>
                <select id="carTypeId">
                  ${config && config.carTypes ? config.carTypes.map(c => `<option value="${c.id}">${c.name}</option>`).join('') : '<option value="1">Седан</option>'}
                </select>
              </div>
              <div class="form-group">
                <label>Ім'я пасажира</label>
                <input type="text" id="passengerName" placeholder="Введіть ім'я" required>
              </div>
              <div class="form-group">
                <label>Телефон пасажира</label>
                <input type="text" id="passengerPhone" placeholder="+380..." required>
              </div>
              <div class="form-group">
                <label>Час подачі</label>
                <input type="datetime-local" id="pickupTime" required>
              </div>
              <div class="form-group">
                <label>Призначити водія (необов'язково)</label>
                <select id="driverId">
                  <option value="">-- Автоматично або без водія --</option>
                  ${Array.isArray(drivers) ? drivers.filter(d => d.status === 'online').map(d => `<option value="${d.id}">${d.name}</option>`).join('') : ''}
                </select>
              </div>
              <button type="submit" id="submitOrderBtn">Створити замовлення</button>
            </form>
          </div>`;

        const updatePrice = () => {
          const from = document.getElementById('fromCity').value;
          const to = document.getElementById('toCity').value;
          const found = tariffs.find(t => t.from === from && t.to === to);
          document.getElementById('routePrice').value = found ? found.price + ' грн' : '1000 грн (базова)';
        };

        document.getElementById('fromCity').onchange = updatePrice;
        document.getElementById('toCity').onchange = updatePrice;
        updatePrice();

        document.getElementById('orderForm').onsubmit = async (e) => {
          e.preventDefault();
          const from = document.getElementById('fromCity').value;
          const to = document.getElementById('toCity').value;
          const found = tariffs.find(t => t.from === from && t.to === to);
          
          const data = {
            routeId: found ? found.id : 1,
            carTypeId: document.getElementById('carTypeId').value,
            passengerName: document.getElementById('passengerName').value,
            passengerPhone: document.getElementById('passengerPhone').value,
            pickupTime: document.getElementById('pickupTime').value,
            driverId: document.getElementById('driverId').value || null,
            routeDescription: `${from} → ${to}`
          };
          const res = await api('/orders', 'POST', data);
          if (res && res.error) alert(res.error);
          else {
            alert('Замовлення успішно створено!');
            switchPage('orders');
          }
        };
      },
      'orders': async (el) => {
        const orders = await api('/orders');
        el.innerHTML = `
          <h2 class="page-title">Замовлення</h2>
          <div class="panel">
            <table>
              <tr><th>ID</th><th>Пасажир</th><th>Телефон</th><th>Час подачі</th><th>Статус</th></tr>
              ${Array.isArray(orders) ? orders.map(o => `
                <tr>
                  <td>#${o.id}</td>
                  <td>${o.passenger_name || '—'}</td>
                  <td>${o.passenger_phone || '—'}</td>
                  <td>${o.pickup_time ? o.pickup_time.replace('T', ' ') : '—'}</td>
                  <td><span class="badge ${o.status}">${o.status}</span></td>
                </tr>
              `).join('') : ''}
            </table>
          </div>`;
      },
      'drivers': async (el) => {
        const drivers = await api('/drivers');
        el.innerHTML = `
          <h2 class="page-title">Водії</h2>
          <div class="panel">
            <table>
              <tr><th>Ім'я</th><th>Телефон</th><th>Статус</th></tr>
              ${Array.isArray(drivers) ? drivers.map(d => `
                <tr>
                  <td>${d.name}</td>
                  <td>${d.phone || '—'}</td>
                  <td><span class="badge ${d.status === 'online' ? 'completed' : 'cancelled'}">${d.status}</span></td>
                </tr>
              `).join('') : ''}
            </table>
          </div>`;
      },
      'routes-tariffs': async (el) => {
        const cityNames = getCities();
        const tariffs = getTariffs();

        el.innerHTML = `
          <h2 class="page-title">Маршрути і тарифи</h2>
          
          <div class="panel">
            <h3 style="font-size: 14px; margin-bottom: 10px; color: var(--accent);">Додати нове місто</h3>
            <form id="addCityForm" style="display: flex; gap: 10px;">
              <input type="text" id="newCityName" placeholder="Назва міста" style="flex:1;" required>
              <button type="submit" style="width: auto; margin-top: 0;">Додати місто</button>
            </form>
          </div>

          <div class="panel">
            <h3 style="font-size: 14px; margin-bottom: 10px; color: var(--accent);">Додати новий маршрут / тариф</h3>
            <form id="addTariffForm">
              <div class="row-flex" style="margin-bottom: 10px;">
                <select id="newFrom" style="flex:1;">${cityNames.map(c => `<option value="${c}">${c}</option>`).join('')}</select>
                <select id="newTo" style="flex:1;">${cityNames.map(c => `<option value="${c}">${c}</option>`).join('')}</select>
              </div>
              <div class="form-group">
                <input type="number" id="newPrice" placeholder="Ціна (грн)" required>
              </div>
              <button type="submit">Додати тариф</button>
            </form>
          </div>

          <div class="panel">
            <h3 style="font-size: 14px; margin-bottom: 10px; color: var(--accent);">Список тарифів</h3>
            <table>
              <tr><th>Звідки</th><th>Куди</th><th>Ціна</th><th>Дії</th></tr>
              ${tariffs.map((t, index) => `
                <tr>
                  <td>${t.from}</td>
                  <td>${t.to}</td>
                  <td><b>${t.price} грн</b></td>
                  <td><button type="button" onclick="window.deleteTariff(${index})" style="background:var(--bad); color:#fff; padding:6px 12px; font-size:12px; width:auto; margin-top:0;">Видалити</button></td>
                </tr>
              `).join('')}
            </table>
          </div>`;

        document.getElementById('addCityForm').onsubmit = (e) => {
          e.preventDefault();
          const cityName = document.getElementById('newCityName').value.trim();
          if (!cityName) return;
          if (cityNames.includes(cityName)) {
            alert("Таке місто вже існує!");
            return;
          }
          cityNames.push(cityName);
          saveCities(cityNames);
          alert('Місто успішно додано!');
          switchPage('routes-tariffs');
        };

        document.getElementById('addTariffForm').onsubmit = (e) => {
          e.preventDefault();
          const from = document.getElementById('newFrom').value;
          const to = document.getElementById('newTo').value;
          const price = Number(document.getElementById('newPrice').value);
          if (from === to) {
            alert("Місто відправлення і призначення не можуть збігатися!");
            return;
          }
          tariffs.push({ id: Date.now(), from, to, price });
          saveTariffs(tariffs);
          switchPage('routes-tariffs');
        };
      },
      'register-driver': async (el) => {
        el.innerHTML = `
          <h2 class="page-title">Реєстрація водія</h2>
          <div class="panel">
            <form id="driverRegForm">
              <div class="form-group">
                <label>Ім'я водія</label>
                <input type="text" id="driverName" placeholder="Введіть ПІБ водія" required>
              </div>
              <div class="form-group">
                <label>Номер телефону</label>
                <input type="text" id="driverPhone" placeholder="+380..." required>
              </div>
              <div class="form-group">
                <label>Telegram ID (необов'язково)</label>
                <input type="text" id="driverTgId" placeholder="ID користувача в Telegram">
              </div>
              <button type="submit">Зареєструвати водія</button>
            </form>
          </div>`;

        document.getElementById('driverRegForm').onsubmit = async (e) => {
          e.preventDefault();
          const data = {
            name: document.getElementById('driverName').value,
            phone: document.getElementById('driverPhone').value,
            telegram_id: document.getElementById('driverTgId').value || null
          };
          const res = await api('/drivers', 'POST', data);
          if (res && res.error) alert(res.error);
          else {
            alert('Водія успішно зареєстровано!');
            switchPage('drivers');
          }
        };
      },
      'reports': async (el) => {
        const orders = await api('/orders');
        const total = Array.isArray(orders) ? orders.length : 0;
        const completed = Array.isArray(orders) ? orders.filter(o => o.status === 'completed').length : 0;
        const cancelled = Array.isArray(orders) ? orders.filter(o => o.status === 'cancelled').length : 0;

        el.innerHTML = `
          <h2 class="page-title">Звіт</h2>
          <div class="panel">
            <div style="font-size: 18px; margin-bottom: 10px;">Усього замовлень: <b>${total}</b></div>
            <div style="font-size: 16px; color: var(--ok);">Завершено: <b>${completed}</b></div>
            <div style="font-size: 16px; color: var(--bad); margin-top: 5px;">Скасовано: <b>${cancelled}</b></div>
          </div>`;
      },
      'dispatchers': async (el) => {
        el.innerHTML = `
          <h2 class="page-title">Диспетчери</h2>
          <div class="panel">
            <form id="dispatcherForm">
              <div class="form-group">
                <label>Логін диспетчера</label>
                <input type="text" id="dispLogin" placeholder="Введіть логін" required>
              </div>
              <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="dispPass" placeholder="Введіть пароль" required>
              </div>
              <button type="submit">Додати диспетчера</button>
            </form>
          </div>`;

        document.getElementById('dispatcherForm').onsubmit = (e) => {
          e.preventDefault();
          alert('Диспетчера успішно збережено!');
          document.getElementById('dispatcherForm').reset();
        };
      }
    };

    window.deleteTariff = function(index) {
      const tariffs = getTariffs();
      tariffs.splice(index, 1);
      saveTariffs(tariffs);
      switchPage('routes-tariffs');
    };

    function switchPage(pageName) {
      document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
      const menuItem = document.querySelector(`[data-page="${pageName}"]`);
      if (menuItem) menuItem.classList.add('active');
      const mainContent = document.getElementById('mainContent');
      if (pages[pageName]) pages[pageName](mainContent);
      loadStats();
    }

    document.getElementById('menu').onclick = (e) => {
      const item = e.target.closest('.menu-item');
      if (item) switchPage(item.dataset.page);
    };

    switchPage('new-order');
    setInterval(loadStats, 10000);
  </script>
</body>
</html>
