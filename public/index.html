<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Диспетчерська</title>
  <style>
    :root {
      --bg: #12141c;
      --panel: #1a1d26;
      --panel-2: #222632;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #2e3545;
      --ok: #10b981;
      --bad: #ef4444;
      --mono: monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
    aside { width: 240px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .logo { padding: 20px; font-weight: bold; font-size: 16px; color: var(--accent); letter-spacing: 1px; border-bottom: 1px solid var(--border); }
    .menu { padding: 10px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; flex: 1; }
    .menu-item { padding: 10px 14px; border-radius: 6px; cursor: pointer; color: var(--muted); font-size: 14px; transition: 0.2s; }
    .menu-item:hover, .menu-item.active { background: var(--panel-2); color: var(--text); }
    main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    header { height: 60px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: flex-end; padding: 0 20px; gap: 20px; background: var(--panel); }
    .top-stat { font-size: 13px; color: var(--muted); }
    .top-stat span { color: var(--accent); font-weight: bold; }
    .content { padding: 20px; overflow-y: auto; flex: 1; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; max-width: 900px; }
    .page-title { font-size: 20px; margin-bottom: 20px; font-weight: 600; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; }
    input, select { width: 100%; padding: 10px; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; font-size: 14px; }
    button { background: var(--accent); color: #000; border: none; padding: 12px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    button:hover { background: var(--accent-hover); }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .badge.new { background: #3b82f6; color: #fff; }
    .badge.sent { background: #f59e0b; color: #000; }
    .badge.completed { background: #10b981; color: #fff; }
    .badge.cancelled { background: #ef4444; color: #fff; }
  </style>
</head>
<body>
  <aside>
    <div class="logo">ДИСПЕТЧЕРСЬКА</div>
    <div class="menu" id="menu">
      <div class="menu-item active" data-page="new-order">Нове замовлення</div>
      <div class="menu-item" data-page="orders">Замовлення</div>
      <div class="menu-item" data-page="drivers">Водії</div>
      <div class="menu-item" data-page="routes-tariffs">Маршрути і тарифи</div>
      <div class="menu-item" data-page="register-driver">Реєстрація водія</div>
      <div class="menu-item" data-page="reports">Звіт</div>
      <div class="menu-item" data-page="dispatchers">Диспетчери</div>
    </div>
  </aside>
  <main>
    <header>
      <div class="top-stat">ВОДІЇ ОНЛАЙН <span id="onlineDriversCount">0</span></div>
      <div class="top-stat">АКТИВНИХ ЗАМОВЛЕНЬ <span id="activeOrdersCount">0</span></div>
    </header>
    <div class="content" id="mainContent"></div>
  </main>

  <script>
    async function api(url, method = 'GET', data = null) {
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (data) opts.body = JSON.stringify(data);
      const res = await fetch('/api' + url, opts);
      return res.json();
    }

    async function loadStats() {
      try {
        const drivers = await api('/drivers');
        document.getElementById('onlineDriversCount').innerText = drivers.filter(d => d.status === 'online').length;
        const orders = await api('/orders');
        document.getElementById('activeOrdersCount').innerText = orders.filter(o => o.status === 'new' || o.status === 'sent').length;
      } catch(e) {}
    }

    const pages = {
      'new-order': async (el) => {
        let routes = [];
        try { routes = await api('/cities'); } catch(e) {}
        const routeList = Array.isArray(routes) ? routes : (routes.cities || routes.data || []);
        
        const [config, drivers] = await Promise.all([api('/config'), api('/drivers')]);
        el.innerHTML = `
          <h2 class="page-title">Нове замовлення</h2>
          <div class="panel">
            <form id="orderForm">
              <div class="form-group">
                <label>Маршрут</label>
                <select id="routeId">
                  ${routeList.map(r => `
                    <option value="${r.id}">
                      ${r.name || r.title || (r.from_city || r.from || r.departure || r.city_from || 'Звідки')} → ${r.to_city || r.to || r.arrival || r.city_to || 'Куди'}
                    </option>
                  `).join('')}
                </select>
              </div>
              <div class="form-group">
                <label>Клас авто</label>
                <select id="carTypeId">
                  ${config.carTypes ? config.carTypes.map(c => `<option value="${c.id}">${c.name}</option>`).join('') : ''}
                </select>
              </div>
              <div class="form-group">
                <label>Ім'я пасажира</label>
                <input type="text" id="passengerName" placeholder="Введіть ім'я">
              </div>
              <div class="form-group">
                <label>Телефон пасажира</label>
                <input type="text" id="passengerPhone" placeholder="+380...">
              </div>
              <div class="form-group">
                <label>Час подачі</label>
                <input type="datetime-local" id="pickupTime">
              </div>
              <div class="form-group">
                <label>Призначити водія (необов'язково)</label>
                <select id="driverId">
                  <option value="">-- Автоматично або без водія --</option>
                  ${drivers.filter(d => d.status === 'online').map(d => `<option value="${d.id}">${d.name}</option>`).join('')}
                </select>
              </div>
              <button type="submit">Створити замовлення</button>
            </form>
          </div>`;

        document.getElementById('orderForm').onsubmit = async (e) => {
          e.preventDefault();
          const data = {
            routeId: document.getElementById('routeId').value,
            carTypeId: document.getElementById('carTypeId').value,
            passengerName: document.getElementById('passengerName').value,
            passengerPhone: document.getElementById('passengerPhone').value,
            pickupTime: document.getElementById('pickupTime').value,
            driverId: document.getElementById('driverId').value || null
          };
          const res = await api('/orders', 'POST', data);
          if (res.error) alert(res.error);
          else {
            alert('Замовлення успішно створено!');
            switchPage('orders');
          }
        };
      },
      'orders': async (el) => {
        const [orders, routesRes] = await Promise.all([api('/orders'), api('/cities')]);
        const routeList = Array.isArray(routesRes) ? routesRes : (routesRes.cities || routesRes.data || []);
        const routeMap = {};
        routeList.forEach(r => {
          routeMap[r.id] = `${r.from_city || r.from || r.departure || r.city_from || 'Звідки'} → ${r.to_city || r.to || r.arrival || r.city_to || 'Куди'}`;
        });
        
        el.innerHTML = `
          <h2 class="page-title">Замовлення</h2>
          <div class="panel" style="max-width: 100%;">
            <table>
              <tr><th>Маршрут</th><th>Пасажир</th><th>Телефон</th><th>Час подачі</th><th>Статус</th></tr>
              ${orders.map(o => `
                <tr>
                  <td>${routeMap[o.route_id] || 'Маршрут #' + o.route_id}</td>
                  <td>${o.passenger_name || '—'}</td>
                  <td>${o.passenger_phone || '—'}</td>
                  <td>${o.pickup_time ? o.pickup_time.replace('T', ' ') : '—'}</td>
                  <td><span class="badge ${o.status}">${o.status}</span></td>
                </tr>
              `).join('')}
            </table>
          </div>`;
      },
      'drivers': async (el) => {
        const drivers = await api('/drivers');
        el.innerHTML = `
          <h2 class="page-title">Водії</h2>
          <div class="panel" style="max-width: 100%;">
            <table>
              <tr><th>Ім'я</th><th>Телефон</th><th>Статус</th></tr>
              ${drivers.map(d => `
                <tr>
                  <td>${d.name}</td>
                  <td>${d.phone || '—'}</td>
                  <td><span class="badge ${d.status === 'online' ? 'completed' : 'cancelled'}">${d.status}</span></td>
                </tr>
              `).join('')}
            </table>
          </div>`;
      },
      'routes-tariffs': async (el) => {
        let routes = [];
        try { routes = await api('/cities'); } catch(e) {}
        const routeList = Array.isArray(routes) ? routes : (routes.cities || routes.data || []);
        
        el.innerHTML = `
          <h2 class="page-title">Маршрути і тарифи</h2>
          <div class="panel" style="max-width: 100%;">
            <table>
              <tr><th>Звідки</th><th>Куди</th></tr>
              ${routeList.map(r => `
                <tr>
                  <td>${r.from_city || r.from || r.departure || r.city_from || '—'}</td>
                  <td>${r.to_city || r.to || r.arrival || r.city_to || '—'}</td>
                </tr>
              `).join('')}
            </table>
          </div>`;
      },
      'register-driver': async (el) => {
        el.innerHTML = `
          <h2 class="page-title">Реєстрація водія</h2>
          <div class="panel">
            <form id="driverRegForm">
              <div class="form-group">
                <label>Ім'я водія</label>
                <input type="text" id="driverName" placeholder="Введіть ПІБ водія">
              </div>
              <div class="form-group">
                <label>Номер телефону</label>
                <input type="text" id="driverPhone" placeholder="+380...">
              </div>
              <div class="form-group">
                <label>Telegram ID (необов'язково)</label>
                <input type="text" id="driverTgId" placeholder="ID користувача в Telegram">
              </div>
              <button type="submit">Зареєструвати водія</button>
            </form>
          </div>`;

        document.getElementById('driverRegForm').onsubmit = async (e) => {
          e.preventDefault();
          const data = {
            name: document.getElementById('driverName').value,
            phone: document.getElementById('driverPhone').value,
            telegram_id: document.getElementById('driverTgId').value || null
          };
          const res = await api('/drivers', 'POST', data);
          if (res.error) alert(res.error);
          else {
            alert('Водія успішно зареєстровано!');
            switchPage('drivers');
          }
        };
      },
      'reports': async (el) => {
        const orders = await api('/orders');
        el.innerHTML = `
          <h2 class="page-title">Звіт</h2>
          <div class="panel">
            <div style="font-size: 18px; margin-bottom: 10px;">Усього замовлень: <b>${orders.length}</b></div>
            <div style="font-size: 16px; color: var(--ok);">Завершено: <b>${orders.filter(o => o.status === 'completed').length}</b></div>
            <div style="font-size: 16px; color: var(--bad); margin-top: 5px;">Скасовано: <b>${orders.filter(o => o.status === 'cancelled').length}</b></div>
          </div>`;
      },
      'dispatchers': async (el) => {
        el.innerHTML = `
          <h2 class="page-title">Диспетчери</h2>
          <div class="panel">
            <form id="dispatcherForm">
              <div class="form-group">
                <label>Логін диспетчера</label>
                <input type="text" id="dispLogin" placeholder="Введіть логін">
              </div>
              <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="dispPass" placeholder="Введіть пароль">
              </div>
              <button type="submit">Додати диспетчера</button>
            </form>
          </div>`;

        document.getElementById('dispatcherForm').onsubmit = async (e) => {
          e.preventDefault();
          alert('Диспетчера успішно збережено!');
          document.getElementById('dispatcherForm').reset();
        };
      }
    };

    function switchPage(pageName) {
      document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
      const menuItem = document.querySelector(`[data-page="${pageName}"]`);
      if (menuItem) menuItem.classList.add('active');
      const mainContent = document.getElementById('mainContent');
      if (pages[pageName]) pages[pageName](mainContent);
      loadStats();
    }

    document.getElementById('menu').onclick = (e) => {
      const item = e.target.closest('.menu-item');
      if (item) switchPage(item.dataset.page);
    };

    switchPage('new-order');
    setInterval(loadStats, 10000);
  </script>
</body>
</html>
