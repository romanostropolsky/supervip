<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вхід диспетчера</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .login-card { background: #1e293b; border: 1px solid #334155; padding: 2.5rem; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .login-card h2 { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.5rem; }
    .login-card p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: #cbd5e1; }
    .form-group input { width: 100%; padding: 0.75rem 1rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; outline: none; }
    .form-group input:focus { border-color: #f59e0b; }
    .btn-submit { width: 100%; padding: 0.8rem; background: #eab308; color: #0f172a; border: none; border-radius: 6px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s; margin-top: 0.5rem; }
    .btn-submit:hover { background: #d97706; }
    .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 1rem; display: none; text-align: center; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Вхід диспетчера</h2>
    <p>Диспетчерська система обліку замовлень</p>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Логін</label>
        <input type="text" id="username" name="username" required autocomplete="username">
      </div>
      
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Увійти</button>
      <div id="errorMsg" class="error-msg"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Вхід...';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && (data.success || data.ok || data.status === 'success')) {
          localStorage.setItem('user', JSON.stringify(data.user || { username, role: data.role }));
          localStorage.setItem('token', data.token || 'fake-jwt-token-for-admin');
          
          alert('Авторизація успішна!');
          window.location.reload();
        } else {
          showError(data.message || 'Невірний логін або пароль');
        }
      } catch (err) {
        showError('Помилка зв\'язку з сервером');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Увійти';
      }
    });

    function showError(msg) {
      errorMsg.innerText = msg;
      errorMsg.style.display = 'block';
    }
  </script>
</body>
</html>
